name: Correspondence Compliance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  correspondence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build StandardEnvelope.sln --configuration Release
      - run: dotnet run --project tests/StandardEnvelope.Tests --configuration Release --no-build
      - run: dotnet run --project demo/StandardEnvelope.Demo --configuration Release --no-build
      - run: dotnet pack src/StandardEnvelope --configuration Release --no-build --output artifacts
